<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RIFT — Match</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="gameScreen"><canvas id="game"></canvas>
<div id="hud"><div class="top"><b>RIFT <small id="modeLabel">MATCH</small></b><b id="alive">ALIVE 1</b></div>
<div class="objective" id="objective"></div><div class="bars"><i id="shield"></i><i id="health"></i></div>
<div class="hotbar" id="hotbar"></div><div class="bottom"><span>🪵 <b id="wood">0</b></span><span>🪨 <b id="stone">0</b></span><span>⚙️ <b id="metal">0</b></span></div></div>
<div id="moveStick" class="stick"><div id="moveKnob" class="knob"></div></div><div id="aimStick" class="stick"><div id="aimKnob" class="knob"></div></div>
<button id="action" class="round-btn">⛏</button><button id="shoot" class="round-btn shoot">●</button><button id="build" class="round-btn build">▣</button>
<button id="leave" class="leave">✕</button><div id="toast"></div></div>
<script type="module" src="game-core.js"></script></body></html>
